# ADMET-Engine Conda Environment
# Based on Section 4.2 & Section 9 of the Project Report
# Usage: conda env create -f environment.yml

name: admet
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip>=23.0
  - numpy>=1.26.0
  - pandas>=2.2.0
  - scikit-learn>=1.3.0
  - h5py>=3.10.0
  - tqdm>=4.66.0
  - psycopg2-binary>=2.9.9
  - pytest>=8.0.0
  - pytest-cov>=5.0.0
  - pip:
    - torch>=2.0.0
    - torch-geometric>=2.4.0
    - torch-scatter>=2.1.0
    - torch-sparse>=2.1.0
    - rdkit-pypi>=2024.09.0
    - deepchem>=2.8.0
    - xgboost>=2.0.0
    - fastapi>=0.110.0
    - "uvicorn[standard]>=0.29.0"
    - pgvector>=0.3.0
    - dvc>=3.50.0
    - mlflow>=2.12.0
